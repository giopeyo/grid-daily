syntax = "proto3";

package devvit.plugin.llm.v1alpha;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/plugin/llm";
option java_package = "com.reddit.devvit.plugin.llm";

// LlmService provides project-scoped LLM inference to Devvit apps.
//
// For example, an app can send a user message such as "Summarize this post"
// to the "gemini-3.8-flash" model in its own LLM Platform project. Each call
// is independent; callers continue a conversation by including its previous
// system, user, and assistant messages in the next request.
service LlmService {
  // Infer generates one assistant response for an ordered sequence of chat messages.
  // The response is returned after generation completes; streaming is not supported.
  rpc Infer(InferenceRequest) returns (InferenceResponse);
}

// MessageRole identifies the author of a chat message.
enum MessageRole {
  // MESSAGE_ROLE_UNSPECIFIED is invalid for inference requests.
  MESSAGE_ROLE_UNSPECIFIED = 0;
  // MESSAGE_ROLE_SYSTEM supplies instructions that guide the model's behavior.
  MESSAGE_ROLE_SYSTEM = 1;
  // MESSAGE_ROLE_USER contains input from the app or its user.
  MESSAGE_ROLE_USER = 2;
  // MESSAGE_ROLE_ASSISTANT contains a prior model response when continuing a conversation.
  MESSAGE_ROLE_ASSISTANT = 3;
}

// Message is one entry in an inference conversation.
message Message {
  // Role identifies who authored the message; for example, MESSAGE_ROLE_USER.
  MessageRole role = 1;
  // Content is the message text; for example, "Write a haiku about Reddit."
  string content = 2;
}

// InferenceRequest describes a single non-streaming chat completion.
message InferenceRequest {
  // Project is the app's LLM Platform project used to authorize and attribute
  // the call; for example, "my-devvit-app".
  string project = 1;
  // Model is an LLM Platform model name, such as "gemini-3.8-flash".
  string model = 2;
  // Messages is the ordered conversation sent to the model. At least one
  // message is required; for example, a single MESSAGE_ROLE_USER message.
  repeated Message messages = 3;
}

// Usage reports the tokens attributed to an inference call.
message Usage {
  // InputTokens is the number of prompt tokens processed; for example, 12.
  int32 input_tokens = 1;
  // OutputTokens is the number of tokens generated; for example, 24.
  int32 output_tokens = 2;
  // TotalTokens is input_tokens plus output_tokens; for example, 36.
  int32 total_tokens = 3;
}

// InferenceResponse contains the assistant's generated text and metadata.
message InferenceResponse {
  // Content is the generated assistant text; for example, "Threads bloom at night...".
  string content = 1;
  // Model is the model that produced the response; for example, "gemini-3.8-flash".
  string model = 2;
  // FinishReason explains why generation ended; for example, "stop".
  string finish_reason = 3;
  // Usage contains token accounting when the model provider reports it.
  Usage usage = 4;
}
