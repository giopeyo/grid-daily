syntax = "proto3";

package devvit.plugin.scheduler;

import "devvit/plugin/scheduler/scheduler.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/plugin/scheduler";
option java_package = "com.reddit.devvit.plugin.scheduler";

// SchedulerMigration lets GKE move waiting actions to AWS. Internal: requires the trusted-caller secret.
service SchedulerMigration {
  // ImportAction adds an action to the waiting queue under its id, skipping limits. Safe to retry.
  rpc ImportAction(ImportActionRequest) returns (ImportActionResponse);
}

message ImportActionRequest {
  // The action as stored by the source; its metadata must name its installation.
  // Example: id "a1b2c3d4-0000-4000-8000-000000000001", state WAITING, with an installation header.
  StorableAction action = 1;

  // When the action is next due: its score in the source waiting queue.
  // Example: "2026-03-14T09:30:00Z" (RFC 3339).
  google.protobuf.Timestamp scheduled_at = 2;
}

message ImportActionResponse {
  // False if the store already held or had canceled the action.
  bool imported = 1;
}
