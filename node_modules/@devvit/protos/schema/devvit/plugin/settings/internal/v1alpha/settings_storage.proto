syntax = "proto3";

package devvit.plugin.settings.internal.v1alpha;

import "devvit/plugin/settings/v1alpha/settings.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/plugin/settings/internalpb";
option java_package = "com.reddit.devvit.plugin.settings.internal";

// Internal storage interface for app and installation settings, hosted by
// devvit-plugins. Callers are responsible for authorization and validation.
service SettingsStorage {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse);
  rpc DeleteSettings(DeleteSettingsRequest) returns (DeleteSettingsResponse);
}

// Identifies the app or installation whose settings are stored.
message SettingsTarget {
  oneof scope {
    // App slug.
    string app_slug = 1;
    // Installation UUID.
    string installation_id = 2;
  }
}

message GetSettingsRequest {
  SettingsTarget target = 1;
}

message GetSettingsResponse {
  devvit.plugin.settings.v1alpha.SettingsValues settings = 1;
}

message SetSettingsRequest {
  SettingsTarget target = 1;

  // Complete settings object, including version and timestamp.
  // Replaces the existing object; does not merge individual fields.
  devvit.plugin.settings.v1alpha.SettingsValues settings = 2;
}

message SetSettingsResponse {
  devvit.plugin.settings.v1alpha.SettingsValues settings = 1;
}

message DeleteSettingsRequest {
  SettingsTarget target = 1;
}

message DeleteSettingsResponse {}
