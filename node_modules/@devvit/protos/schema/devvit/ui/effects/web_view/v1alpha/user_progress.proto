syntax = "proto3";

package devvit.ui.effects.web_view.v1alpha;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/ui/effects/web_view/v1alpha";
option java_package = "com.reddit.devvit.ui.effects.web_view.v1alpha";

// User progress from accepted Journey events, delivered without an acknowledgement.
// Clients bind this update to the originating web view's post and authenticated
// session, ignoring updates when that context is no longer valid.
message WebViewUserProgressEffect {
  enum State {
    // No progress state was provided. Receivers ignore this value.
    UNSPECIFIED = 0;
    // Any accepted progress call, including progress({ progress: 0 }).
    STARTED = 1;
    // Accepted endJourney({ complete: true }), even without prior progress.
    COMPLETED = 2;
  }

  // The user's progress state for the Journey.
  State state = 1;
}
