syntax = "proto3";

package devvit.ui.effects.web_view.v1alpha;

// Add your custom effects and events within a new folder to serve as a namespace
import "creation/create_post.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/ui/effects/web_view/v1alpha";
option java_package = "com.reddit.devvit.ui.effects.web_view.v1alpha";

// ClientEffect carries requests from a Devvit web view to its hosting Reddit
// client (web, Android, or iOS). Host clients consume these effects to perform
// actions. Add payloads in feature packages outside `devvit` and assign each new variant
// an unused field number.
message ClientEffect {
  // To add a new message that is sent from the devvit app and into the client, add your message
  oneof effect {
    creation.ComposerLoaded composer_loaded = 1;
    // Reports changes to the validity of the current app-owned draft.
    creation.PostReadyStateChange post_ready_state_change = 2;
  }
}

// ClientEvent carries messages from a hosting Reddit client (web, Android,
// or iOS) to a Devvit web view. App code consumes them through WebViewInternalEventMessage.
// Add payloads in feature packages outside `devvit` and assign each new variant
// an unused field number.
message ClientEvent {
  // To add a new message that is sent from the client and into the devvit app, add your message
  oneof event {
    creation.SubmitPost submit_post = 1;
  }
}
