syntax = "proto3";

package devvit.dev_portal.app_publish_request.auto_review;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/dev_portal/app_publish_request/auto_review";

// This API is the contract between review workers and Agent Sandbox. A
// validated AutoReviewReport is also serialized into Prisma `AutoReview.review` (see devvit-dev-portal/prisma/schema.prisma).
// Do not make breaking changes.

// The recommendation produced by auto review.
// Corresponds to Prisma.
enum AutoReviewDecision {
  AUTO_REVIEW_DECISION_UNSPECIFIED = 0;
  // Auto review cannot make a final decision. Human review is required.
  AUTO_REVIEW_DECISION_NEEDS_REVIEW = 1;
  // The app is eligible for automated approval. Consider confidence.
  AUTO_REVIEW_DECISION_APPROVED = 2;
  // The app is eligible for automated denial. Consider confidence.
  AUTO_REVIEW_DECISION_DENIED = 3;
}

// The outcome of an individual review stage.
enum AutoReviewStageStatus {
  AUTO_REVIEW_STAGE_STATUS_UNSPECIFIED = 0;
  // The stage completed and its expectations were satisfied.
  AUTO_REVIEW_STAGE_STATUS_PASSED = 1;
  // The stage completed, but the app did not satisfy its expectations.
  AUTO_REVIEW_STAGE_STATUS_FAILED = 2;
  // The agent could not complete or evaluate the stage.
  AUTO_REVIEW_STAGE_STATUS_ERROR = 3;
  // The stage was intentionally not run.
  AUTO_REVIEW_STAGE_STATUS_SKIPPED = 4;
}

// A stage that may be performed by the auto-review prompt. Stages may run in parallel within a review by subagents as subtasks.
//
// Keep this list as a superset of the stages requested by supported prompt
// versions.
enum AutoReviewStage {
  AUTO_REVIEW_STAGE_UNSPECIFIED = 0;
  // Test whether the auto review account can access the subreddit.
  AUTO_REVIEW_STAGE_USER_CAN_VIEW = 1;
  // Find a post by the app.
  AUTO_REVIEW_STAGE_POST_EXISTS = 2;
  // Lighthouse tests are executed.
  AUTO_REVIEW_STAGE_RUN_USER_LIGHTHOUSE = 3;
}

enum AutoReviewSeverity {
  AUTO_REVIEW_SEVERITY_UNSPECIFIED = 0;
  AUTO_REVIEW_SEVERITY_INFO = 1;
  AUTO_REVIEW_SEVERITY_WARNING = 2;
  AUTO_REVIEW_SEVERITY_ERROR = 3;
}

// A file type produced during auto review.
enum AutoReviewArtifactType {
  AUTO_REVIEW_ARTIFACT_TYPE_UNSPECIFIED = 0;
  AUTO_REVIEW_ARTIFACT_TYPE_LOG = 1;
  AUTO_REVIEW_ARTIFACT_TYPE_SCREENSHOT = 2;
  AUTO_REVIEW_ARTIFACT_TYPE_VIDEO = 3;
}

// A File produced during auto review.
message AutoReviewArtifact {
  // Complete filename from workspace root. Slashes are forward.
  // For example: "artifacts/screenshots/app-home.png"
  string filename = 1;

  // Size of the workspace file in bytes.
  uint32 size_bytes = 2;

  AutoReviewArtifactType type = 3;
}

// An informational message, warning, or error observed by the agent.
// Note: web browser logs are recorded as artifacts.
message AutoReviewNotice {
  // Concise plaintext overview suitable for a list or disclosure heading.
  string summary = 1;

  // Additional plaintext information.
  string detail = 2;

  // Relevant artifact filenames.
  repeated string filenames = 3;

  AutoReviewSeverity severity = 4;
}

// The result of one auto review stage.
message AutoReviewStageResult {
  AutoReviewStage stage = 1;
  AutoReviewStageStatus status = 2;

  // Concise plaintext overview suitable for a list or disclosure heading.
  string summary = 3;

  repeated AutoReviewNotice notices = 4;

  // Artifacts relevant to the current stage. Eg, a screenshot may be taken during one stage and should be shown there.
  repeated string filenames = 5;

  // Wall-clock time from stage start to stage completion, in milliseconds.
  uint32 duration_millis = 6;

  // Stage-specific structured data, when available.
  //
  // The populated field must correspond to stage.
  oneof detail {
    AutoReviewLighthouseStageDetail lighthouse = 10;
  }
}

// Data specific to the Lighthouse stage of auto review.
message AutoReviewLighthouseStageDetail {
  optional double first_contentful_paint_millis = 1;
  optional double render_duration_millis = 2;
  optional double load_time_millis = 3;
  optional double cumulative_layout_shift = 4;

  // Lighthouse performance-category score in the range [0, 1].
  optional double lighthouse_performance_score = 5;

  // Lighthouse version that produced the measurements, such as "12.2.1".
  string lighthouse_version = 6;

  uint32 console_error_count = 7;
  uint32 console_warning_count = 8;

  // The total number of console API calls recorded across `console.log()` / `warn()` / `error()` / etc.
  uint32 console_count = 9;

  uint32 uncaught_exception_count = 10;
  uint32 unhandled_rejection_count = 11;
  uint32 failed_network_request_count = 12;
}

// The embedded response from an Sandbox Agent and recorded in the database.
message AutoReviewReport {
  AutoReviewDecision decision = 1;

  // Agent-reported confidence in decision in the range [0, 1].
  double confidence = 2;

  // Concise plaintext overview suitable for a list or disclosure heading.
  string summary = 3;

  repeated AutoReviewArtifact artifacts = 5;

  repeated AutoReviewStageResult stage_results = 6;
}
