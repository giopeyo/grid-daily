syntax = "proto3";

package devvit.dev_portal.app_publish_request.review;

import "devvit/dev_portal/reddit/redditor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/apppublishrequest";

enum AppPublishRequestReviewDecision {
  APPROVED = 0;
  DENIED = 1;
  OBSOLETE = 2;
}

message AppPublishRequestReview {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  devvit.dev_portal.reddit.Redditor reviewer = 4;
  AppPublishRequestReviewDecision decision = 5;
  // Reasons recorded for a denied review, in the order shown to the developer.
  repeated AppPublishRequestReviewRejectionReason rejection_reasons = 6;
}

// Identifies whether a rejection reason came from a managed template or was written by the reviewer.
enum AppPublishRequestReviewRejectionReasonSource {
  // No source was supplied. Persisted rejection reasons must use TEMPLATE or CUSTOM.
  APP_PUBLISH_REQUEST_REVIEW_REJECTION_REASON_SOURCE_UNSPECIFIED = 0;
  // The reviewer selected a managed rejection-reason template.
  APP_PUBLISH_REQUEST_REVIEW_REJECTION_REASON_SOURCE_TEMPLATE = 1;
  // The reviewer wrote a reason without selecting a template.
  APP_PUBLISH_REQUEST_REVIEW_REJECTION_REASON_SOURCE_CUSTOM = 2;
}

// Records a reviewer-provided reason for denying an app publish request.
//
// Template-derived reasons populate the template ID and title; custom reasons omit both fields.
// Snapshot fields capture the values when the review decision is submitted and do not change if
// the source template is later edited. For example, a template-derived reason can have the title
// "Missing privacy policy" and the body "Add a link to your privacy policy before resubmitting."
message AppPublishRequestReviewRejectionReason {
  // Whether the reason came from a managed template or was written by the reviewer.
  AppPublishRequestReviewRejectionReasonSource source = 1;
  // ID of the selected template. Populated only when source is TEMPLATE.
  optional string source_template_id = 2;
  // Title of the selected template when the decision was submitted. Populated only for TEMPLATE.
  optional string template_title_snapshot = 3;
  // Exact template-derived or custom reason text when the decision was submitted.
  string reason_body_snapshot = 4;
}

message AppPRSetReviewDecisionRequest {
  string app_publish_request_id = 1;
  AppPublishRequestReviewDecision decision = 2;
  // Reasons to persist for a denied review, in display order; empty when no reasons are supplied.
  repeated AppPublishRequestReviewRejectionReason rejection_reasons = 3;
}
