syntax = "proto3";

package devvit.dev_portal.app.info;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/app/info";

// ComputeCluster represents the compute infrastructure cluster where an app
// installation runs.
enum ComputeCluster {
  // Unspecified cluster - should not be used in practice.
  COMPUTE_CLUSTER_UNSPECIFIED = 0;
  // Deprecated: devvit-compute-go runtime.
  COMPUTE_GO = 1 [deprecated = true];
  // devvit-orchestrator, apps on GKE prod cluster
  ELYSIUM_GCP = 2;
  // Deprecated: devvit-compute-go staging runtime.
  COMPUTE_GO_STAGING = 3 [deprecated = true];
  // devvit-orchestrator, apps on GKE staging cluster
  ELYSIUM_GCP_STAGING = 4;
  // devvit-orchestrator, apps on GKE prod cluster / devvit-elysium-canary namespace
  ELYSIUM_GCP_CANARY = 5;
  // Elysium production runtime, apps on AWS.
  AWS_PROD_1 = 6;
  // Elysium staging runtime, apps on AWS.
  AWS_STAGING = 7;
  // Elysium canary runtime, apps on AWS.
  AWS_CANARY = 8;
}
