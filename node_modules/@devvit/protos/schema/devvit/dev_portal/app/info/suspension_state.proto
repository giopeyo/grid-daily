syntax = "proto3";

package devvit.dev_portal.app.info;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/app/info";

// AppSuspensionState describes whether an app is temporarily prevented from
// serving.
// This enum maps 1-to-1 to its Prisma equivalent in prisma/schema.prisma, so
// they must be kept in sync.
enum AppSuspensionState {
  // The app is serving normally.
  NOT_SUSPENDED = 0;
  // The app is temporarily unavailable while it undergoes maintenance.
  MAINTENANCE = 1;
}
