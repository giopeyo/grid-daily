syntax = "proto3";

package devvit.autoscaler;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/autoscaler";
option java_package = "com.reddit.devvit.autoscaler";

// EnsurePodExistsRequest identifies a compute context that needs a Pod.
message EnsurePodExistsRequest {
  reserved 1;
  reserved "installation_id";
  string compute_context_id = 2;
}

// EnsurePodExistsResponse acknowledges that the target has been raised to at
// least one replica.
message EnsurePodExistsResponse {}

// ReplacePodReason describes why app-proxy determined that a Pod must be
// replaced.
enum ReplacePodReason {
  REPLACE_POD_REASON_UNSPECIFIED = 0;
  REPLACE_POD_REASON_CONNECTION_REFUSED = 1;
}

// ReplacePodRequest identifies an exact claimed Pod that must be replaced.
message ReplacePodRequest {
  reserved 1;
  reserved "installation_id";
  string compute_context_id = 5;
  string pod_name = 2;
  string pod_uid = 3;
  ReplacePodReason reason = 4;
}

// ReplacePodResponse acknowledges that replacement demand has been recorded
// and the stale Pod has either been deleted or is already absent.
message ReplacePodResponse {}

// Autoscaler is the sole owner of replica-count mutations for Elysium
// workloads.
service Autoscaler {
  rpc EnsurePodExists(EnsurePodExistsRequest) returns (EnsurePodExistsResponse);
  rpc ReplacePod(ReplacePodRequest) returns (ReplacePodResponse);
}
