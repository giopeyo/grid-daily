syntax = "proto3";

package creation;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/creation";
option java_package = "com.reddit.creation";

// ComposerLoaded reports whether the Devvit composer loaded successfully to the hosting client.
message ComposerLoaded {
  bool success = 1;
  string error = 2;
}

// PostReadyStateChange reports whether the current app draft is valid for submission.
// Readiness can change in either direction and does not replace ComposerLoaded.
// For example, an image composer sends ready=true after an image finishes uploading
// and ready=false if the user removes that image.
message PostReadyStateChange {
  // False revokes previously reported readiness; the host also validates native fields.
  bool ready = 1;
}

// SubmitPost requests that the Devvit composer submit a post to the specified subreddit.
message SubmitPost {
  string subreddit_id = 1;
}
